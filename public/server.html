<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Server panel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e6e8eb;font:14px system-ui,sans-serif}
main{max-width:860px;margin:auto;padding:14px}
input,select,textarea,button{font:inherit;border-radius:8px;border:1px solid #2b323b;background:#151a20;color:inherit;padding:9px 11px}
button{cursor:pointer}button.go{background:#d92d43;border-color:#d92d43}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}.row>input,.row>select{flex:1;min-width:140px}
.item{display:flex;justify-content:space-between;gap:8px;padding:9px 4px;border-bottom:1px solid #1e242c;align-items:center}
.item span{cursor:pointer;word-break:break-all}
textarea,pre{width:100%;font:12px ui-monospace,monospace}textarea{height:55vh;white-space:pre}
pre{background:#151a20;padding:10px;border-radius:8px;overflow:auto;max-height:60vh;white-space:pre-wrap}
[hidden]{display:none!important}a{color:#ff6b7d}#msg{min-height:20px;color:#ffb4bd}
</style></head><body><main>
<div class="row"><a href="/admin">← Admin</a><b>Server panel</b></div>
<form id="login" class="row"><input id="ak" type="password" placeholder="Admin key"><input id="pk" type="password" placeholder="Panel key"><button class="go">Open</button></form>
<div id="msg" role="status"></div>
<div id="app" hidden>
<div class="row"><select id="srv"></select></div>
<div class="row"><button data-t="info">Status</button><button data-t="files">Files</button><button data-t="pkgs">Packages</button><button data-t="logs">Logs</button></div>
<section id="info"><pre id="infoBox"></pre><div class="row"><button id="reload">Reload plugins</button><button id="restart" class="go">Restart server</button></div></section>
<section id="files" hidden>
 <div class="row"><button id="up">⬆ Up</button><b id="cwd"></b></div>
 <div class="row"><button id="newFile">New file</button><button id="newDir">New folder</button><input id="upload" type="file" multiple></div>
 <div id="list"></div>
 <div id="editor" hidden><div class="row"><b id="fname"></b></div><textarea id="text" spellcheck="false"></textarea><div class="row"><button id="save" class="go">Save</button><button id="close">Close</button></div></div>
</section>
<section id="pkgs" hidden><div class="row"><input id="pkg" placeholder="package or package@version" autocapitalize="off"><button id="install" class="go">Install</button></div><pre id="job" hidden></pre><div id="pkgList"></div></section>
<section id="logs" hidden><div class="row"><button id="logRefresh">Refresh</button></div><pre id="logBox"></pre></section>
</div>
</main><script>
const $=id=>document.getElementById(id);
let ak=sessionStorage.getItem('st_admin_key')||'',pk=sessionStorage.getItem('xz_panel_key')||'',dir='',file='',tab='info',timer;
const say=t=>$('msg').textContent=t||'';
async function raw(url,body){
  const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-api-key':ak,'x-panel-key':pk,'content-type':'application/json'},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({error:'HTTP '+r.status}));
  if(!r.ok||d.success===false)throw new Error(d.error||'HTTP '+r.status);
  return d;
}
const api=(action,{query,body}={})=>raw('/api/panel/'+encodeURIComponent($('srv').value)+'/'+action+(query?'?'+new URLSearchParams(query):''),body);
const run=fn=>async(...a)=>{try{say('');await fn(...a)}catch(e){say(e.message)}};
const join=n=>dir?dir+'/'+n:n;
function row(label,onOpen,buttons){
  const d=document.createElement('div');d.className='item';
  const s=document.createElement('span');s.textContent=label;if(onOpen)s.onclick=run(onOpen);d.append(s);
  const b=document.createElement('div');for(const[t,f]of buttons){const x=document.createElement('button');x.textContent=t;x.onclick=run(f);b.append(x)}d.append(b);return d;
}
async function loadInfo(){const{success,...i}=await api('info');$('infoBox').textContent=JSON.stringify(i,null,2)}
async function loadFiles(){
  const r=await api('files',{query:{path:dir}});$('cwd').textContent='/'+r.path;
  $('list').replaceChildren(...r.items.map(f=>row((f.dir?'📁 ':'📄 ')+f.name,
    async()=>{if(f.dir){dir=join(f.name);await loadFiles()}else await openFile(join(f.name))},
    [['Delete',async()=>{if(confirm('Delete '+f.name+'?')){await api('delete',{body:{path:join(f.name)}});await loadFiles()}}]])));
}
async function openFile(p){
  const r=await api('file',{query:{path:p}});
  if(r.binary){const a=document.createElement('a');a.href='data:application/octet-stream;base64,'+r.content;a.download=p.split('/').pop();a.click();return}
  edit(p,r.content);
}
function edit(p,content){file=p;$('fname').textContent=p;$('text').value=content;$('editor').hidden=false;$('editor').scrollIntoView()}
function showJob(j){$('job').hidden=!j;if(j)$('job').textContent=j.action+' '+j.package+': '+(j.running?'running…':j.ok?'done':'failed')+'\n'+j.output}
async function loadPkgs(){
  clearTimeout(timer);const r=await api('packages');showJob(r.job);
  $('pkgList').replaceChildren(...r.packages.map(p=>row(p.name+'  '+(p.installed||'(missing)'),null,[['Remove',async()=>{if(confirm('Remove '+p.name+'?')){await api('packages',{body:{action:'uninstall',name:p.name}});await loadPkgs()}}]])));
  if(r.job&&r.job.running&&tab==='pkgs')timer=setTimeout(run(loadPkgs),3000);
}
async function loadLogs(){const r=await api('logs',{query:{lines:300}});$('logBox').textContent=r.lines.join('\n');$('logBox').scrollTop=1e9}
const loaders={info:loadInfo,files:loadFiles,pkgs:loadPkgs,logs:loadLogs};
async function show(t){tab=t;for(const k in loaders)$(k).hidden=k!==t;await loaders[t]()}
async function open_(){
  const r=await raw('/api/servers');
  $('srv').replaceChildren(...r.servers.map(s=>new Option(s.name+' ('+s.id+')',s.id)));
  const want=new URLSearchParams(location.search).get('id');if(want)$('srv').value=want;
  await show('info');
  sessionStorage.setItem('st_admin_key',ak);sessionStorage.setItem('xz_panel_key',pk);
  $('app').hidden=false;$('login').hidden=true;
}
$('login').onsubmit=run(async e=>{e.preventDefault();ak=$('ak').value.trim()||ak;pk=$('pk').value.trim()||pk;await open_()});
$('srv').onchange=run(async()=>{dir='';$('editor').hidden=true;clearTimeout(timer);await show(tab)});
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=run(()=>show(b.dataset.t)));
$('reload').onclick=run(async()=>{const r=await api('reload',{body:{}});say(r.loaded+' commands loaded')});
$('restart').onclick=run(async()=>{if(confirm('Restart this server?'))say((await api('restart',{body:{}})).note)});
$('up').onclick=run(async()=>{dir=dir.split('/').slice(0,-1).join('/');await loadFiles()});
$('newFile').onclick=()=>{const n=prompt('File name');if(n)edit(join(n),'')};
$('newDir').onclick=run(async()=>{const n=prompt('Folder name');if(n){await api('mkdir',{body:{path:join(n)}});await loadFiles()}});
$('upload').onchange=run(async e=>{
  for(const f of e.target.files){
    if(f.size>3*1048576)throw new Error(f.name+' is bigger than 3 MB');
    const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]||'');r.onerror=no;r.readAsDataURL(f)});
    say((await api('file',{body:{path:join(f.name),content:data,base64:true}})).note);
  }
  e.target.value='';await loadFiles();
});
$('save').onclick=run(async()=>{say((await api('file',{body:{path:file,content:$('text').value}})).note);await loadFiles()});
$('close').onclick=()=>$('editor').hidden=true;
$('install').onclick=run(async()=>{await api('packages',{body:{action:'install',name:$('pkg').value}});await loadPkgs()});
$('logRefresh').onclick=run(loadLogs);
if(ak&&pk)run(open_)();
</script></body></html>
